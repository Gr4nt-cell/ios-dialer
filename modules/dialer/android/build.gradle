plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dialer'
version = '1.0.0'

android {
  namespace "expo.modules.dialer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  // the voice models are read straight out of the package, so they must not be
  // compressed on the way in
  androidResources {
    noCompress 'onnx'
  }
}

repositories {
  // scripts/fetch-voices.sh puts the sherpa-onnx runtime here: AGP refuses a
  // bare .aar file dependency inside a library module, so it arrives as a
  // Maven module instead
  maven { url "${rootProject.projectDir}/local-maven" }
}

dependencies {
  implementation "com.k2fsa:sherpa-onnx:1.13.7"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
