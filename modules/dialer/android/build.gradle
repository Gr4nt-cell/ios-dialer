plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dialer'
version = '1.0.0'

android {
  namespace "expo.modules.dialer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

repositories {
  maven { url uri("$projectDir/libs/maven") }
}

dependencies {
  implementation files("libs/jump3r-core-1.0.5.jar")
  implementation "com.k2fsa.sherpa:offline-tts:1.12.26"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // on-device subject segmentation, for the call screen's depth effect
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
}
