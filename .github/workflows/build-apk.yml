# Builds the APK on GitHub's own machines (no Expo build quota needed) and publishes it
# to the "latest" release: https://github.com/Gr4nt-cell/ios-dialer/releases/tag/latest
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The AI-generated portrait used by Settings > Depth Adjustment. Fetched once from the
      # image service and committed, so later builds already have it.
      - name: Fetch the depth-preview portrait (first build only)
        run: |
          F=modules/dialer/android/src/main/assets/preview_woman.jpg
          if [ ! -s "$F" ]; then
            mkdir -p "$(dirname "$F")"
            curl -fsSL "https://cdn.gamma.app/uautxw44sktw1ty/design-anything/jCFhrdnHbcJSRbYgC6RkR/6yYfoJvfTUe_p6WB_9US0.jpg" -o "$F"
            (convert "$F" -resize 900x -strip -quality 86 "$F.tmp" && mv "$F.tmp" "$F") || true
            file "$F"; ls -l "$F"
            COMMIT_PORTRAIT=1
          fi
          if [ "${COMMIT_PORTRAIT:-0}" = "1" ] && [ "${{ github.workflow }}" = "Build APK" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add "$F" && git commit -m "Add the AI-generated depth preview portrait" && git push origin HEAD:main || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Show release shrinking settings
        run: grep -nE "minifyEnabled|shrinkResources|enableProguard|enableShrink" android/app/build.gradle android/gradle.properties || true

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" ios-dialer.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest APK" --notes "Built automatically from main."
          gh release upload latest ios-dialer.apk --clobber
          gh release edit latest --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."
