# Builds an installable APK on Expo's servers (EAS Build).
# Setup: repo Settings › Secrets and variables › Actions › New secret
#   Name: EXPO_TOKEN   Value: an access token from expo.dev › Account settings › Access tokens
# Then: Actions tab › Build APK › Run workflow. The APK link appears in the log and on expo.dev.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          npm install
          npx expo install --fix

      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait
