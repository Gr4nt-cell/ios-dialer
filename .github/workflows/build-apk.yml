# Builds the APK on GitHub's own machines (no Expo build quota needed) and publishes it
# to the "latest" release: https://github.com/Gr4nt-cell/ios-dialer/releases/tag/latest
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the build number is the commit count

      # The AI-generated portrait used by Settings > Depth Adjustment. Fetched once from the
      # image service and committed, so later builds already have it.
      - name: Fetch the depth-preview portrait (first build only)
        run: |
          F=modules/dialer/android/src/main/assets/preview_woman.jpg
          if [ ! -s "$F" ]; then
            mkdir -p "$(dirname "$F")"
            curl -fsSL "https://cdn.gamma.app/uautxw44sktw1ty/design-anything/jCFhrdnHbcJSRbYgC6RkR/6yYfoJvfTUe_p6WB_9US0.jpg" -o "$F"
            (convert "$F" -resize 900x -strip -quality 86 "$F.tmp" && mv "$F.tmp" "$F") || true
            file "$F"; ls -l "$F"
            COMMIT_PORTRAIT=1
          fi
          if [ "${COMMIT_PORTRAIT:-0}" = "1" ] && [ "${{ github.workflow }}" = "Build APK" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add "$F" && git commit -m "Add the AI-generated depth preview portrait" && git push origin HEAD:main || true
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check that every source file parses
        run: node scripts/check-syntax.cjs

      - name: Set the build number (versionCode)
        run: echo "VERSION_CODE=$((100 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - uses: actions/cache@v4
        with:
          path: |
            android/local-maven/
            modules/dialer/android/src/main/assets/tts/
            modules/dialer/android/src/main/assets/espeak-ng-data/
          key: offline-caller-voices-v1-${{ runner.os }}

      - name: Prepare offline AI caller voices
        run: bash scripts/prepare-voice-assets.sh

      - name: Show release shrinking settings
        run: grep -nE "minifyEnabled|shrinkResources|enableProguard|enableShrink" android/app/build.gradle android/gradle.properties || true

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # the log blobs aren't readable from everywhere, so keep the tail of a
      # failure on the release page where it can actually be fetched
      - name: Publish the failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "error:|FAILED|What went wrong|Could not resolve|Caused by|^e: " "$RUNNER_TEMP/gradle.log" | tail -60 > apk-build-error.txt || true
          echo "----- last lines -----" >> apk-build-error.txt
          tail -120 "$RUNNER_TEMP/gradle.log" >> apk-build-error.txt || true
          gh release upload latest apk-build-error.txt --clobber || true
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: What architectures the APK carries
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | awk '/lib\//{split($4,a,"/"); print a[2]}' | sort -u || true
          echo "size: $(du -h "$APK" | cut -f1)"

      - name: Google Play readiness check
        run: node scripts/play-check.js android

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" ios-dialer.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest APK" --notes "Built automatically from main."
          gh release upload latest ios-dialer.apk --clobber
          [ -f play-check.txt ] && gh release upload latest play-check.txt --clobber || true
          gh release edit latest --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')."

      - name: Publish the readiness report if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ -f play-check.txt ] && gh release upload latest play-check.txt --clobber || true'
