# Builds an Android App Bundle (.aab) and publishes it to the "latest" release.
#
# Run on demand only — the bundle carries every CPU architecture, so it takes
# noticeably longer than the APK build that runs on each push:
#   gh workflow run build-aab.yml
#
# SIGNING: `expo prebuild` wires the release build to the debug keystore, so the
# bundle this produces is debug-signed. That is fine for internal testing, but
# Google Play rejects it. To publish, add an upload keystore as repository
# secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD) and sign with those instead.
name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-aab
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # All four architectures: Play splits the bundle per device, so leaving
      # any out means those devices simply can't install the app.
      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          cp "$AAB" ios-dialer.aab
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from main."
          gh release upload latest ios-dialer.aab --clobber
