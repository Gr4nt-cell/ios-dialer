# Builds a signed Android App Bundle (.aab) and publishes it to the "latest"
# release: https://github.com/Gr4nt-cell/ios-dialer/releases/tag/latest
#
# Run on demand — the bundle carries every CPU architecture, so it takes
# noticeably longer than the APK build that runs on each push:
#   gh workflow run build-aab.yml
#
# SIGNING: with these four repository secrets set (Settings › Secrets and
# variables › Actions) the bundle is signed during the build and published as
# ios-dialer.aab. Without them it still builds, but comes out debug-signed and
# is published as ios-dialer-unsigned.aab — named so nobody uploads it to Play
# by mistake, since Play only rejects it after the upload:
#   ANDROID_KEYSTORE_BASE64    the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          upload
#   ANDROID_KEY_PASSWORD       the key password (same as the store password)
#
# Keep the keystore itself somewhere safe: Play ties the app to this key for
# good, unless Play App Signing is on, which allows an upload key reset.
name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-aab
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The AI-generated portrait used by Settings > Depth Adjustment. Fetched once from the
      # image service and committed, so later builds already have it.
      - name: Fetch the depth-preview portrait (first build only)
        run: |
          F=modules/dialer/android/src/main/assets/preview_woman.jpg
          if [ ! -s "$F" ]; then
            mkdir -p "$(dirname "$F")"
            curl -fsSL "https://cdn.gamma.app/uautxw44sktw1ty/design-anything/jCFhrdnHbcJSRbYgC6RkR/6yYfoJvfTUe_p6WB_9US0.jpg" -o "$F"
            (convert "$F" -resize 900x -strip -quality 86 "$F.tmp" && mv "$F.tmp" "$F") || true
            file "$F"; ls -l "$F"
            COMMIT_PORTRAIT=1
          fi
          if [ "${COMMIT_PORTRAIT:-0}" = "1" ] && [ "${{ github.workflow }}" = "Build APK" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add "$F" && git commit -m "Add the AI-generated depth preview portrait" && git push origin HEAD:main || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the upload keystore
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no signing secrets — building a debug-signed bundle, which Play will not accept"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # outside the repo, so `expo prebuild` can't wipe it
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Show release shrinking settings
        run: grep -nE "minifyEnabled|shrinkResources|enableProguard|enableShrink" android/app/build.gradle android/gradle.properties || true

      # prebuild wires release to the debug key; this repoints it
      - name: Sign release builds with the upload key
        if: steps.key.outputs.have == 'true'
        run: node scripts/use-upload-key.js

      # All four architectures: Play splits the bundle per device, so leaving
      # any out means those devices simply can't install the app.
      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # R8 over every architecture needs more memory than the template default
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          grep jvmargs gradle.properties || echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # if the bundle fails, keep the end of the log on the release page so it can be read
      - name: Publish the failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "error|Error|FAILED|What went wrong|Exception" "$RUNNER_TEMP/gradle.log" | tail -80 > aab-build-error.txt || true
          echo "----- last lines -----" >> aab-build-error.txt
          tail -120 "$RUNNER_TEMP/gradle.log" >> aab-build-error.txt || true
          gh release upload latest aab-build-error.txt --clobber || true

      - name: Check who signed it
        if: steps.key.outputs.have == 'true'
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary -certs "$AAB" | grep -E "^ *X\.509|jar verified" || true
          if jarsigner -verify -certs "$AAB" | grep -q "Android Debug"; then
            echo "::error::the bundle is still signed with the debug key"
            exit 1
          fi

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ "${{ steps.key.outputs.have }}" = "true" ]; then NAME=ios-dialer.aab; else NAME=ios-dialer-unsigned.aab; fi
          cp "$AAB" "$NAME"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from main."
          gh release upload latest "$NAME" --clobber
